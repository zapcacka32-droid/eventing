# Релиз policies в ecpk-knative-serving.
# Внутри неймспейса трафик свободный, здесь только вход извне.
# act — activator. wh — webhook serving: kube-apiserver вне сетки.
# Сеть узлов EDP в ТПР не указана, в wh оставлен только join kube-ovn.

identity:
  instance: ed
  cluster: tco
  project: ecpk

policies: []

netpol:
  - name: base
    ingress:
      - from:
          - namespace: ecpk-knative-serving
          - ipBlock:
              cidr: 169.254.7.127/32
          - ipBlock:
              cidr: 100.96.0.0/16
  - name: act
    selector:
      app: activator
    ingress:
      - from:
          - namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: Exists
        ports:
          - port: 8012
          - port: 8013

authzpol:
  - name: act
    action: ALLOW
    selector:
      app: activator
    rules:
      - from:
          namespaces:
            - "*"
        ports:
          - port: 8012
          - port: 8013
  - name: wh
    action: ALLOW
    selector:
      app: webhook
    rules:
      - from:
          ipBlocks:
            - 100.96.0.0/16
        ports:
          - port: 8443
