          - namespace: kube-system
          # Проба kubelet в ambient: link-local и join-подсеть kube-ovn.
          - ipBlock:
              cidr: 169.254.7.127/32
          - ipBlock:
              cidr: 100.96.0.0/16
        ports:
          - port: 8080
          - port: 8443
          - port: 9090
          - port: 15008
  - name: bdsp
