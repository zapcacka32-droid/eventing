# ecpk-knative-eventing, EDP techsec-dev. Имя неймспейса из ТПР.
# Ingress только на webhook, data-plane и раздачу манифестов.
# Сеть узлов EDP в ТПР не указана: адрес kube-apiserver сюда не добавлен.

identity:
  instance: ed
  cluster: tco
  project: ecpk

policies: []

netpol:
  - name: wh
    selector:
      app: eventing-webhook
    ingress:
      - from:
          - namespace: ecpk-knative-eventing
          - namespace: ecpk-knative-serving
          - namespace: ecpk-knative-kafka
          - namespace: ecpk-knative-operator
          - namespace: kube-system
          # Проба kubelet в ambient: link-local и join-подсеть kube-ovn.
          - ipBlock:
              cidr: 169.254.7.127/32
          - ipBlock:
              cidr: 100.96.0.0/16
        ports:
          - port: 443
          - port: 8443
          - port: 15008
  - name: kwh
    selector:
      app: kafka-webhook-eventing
    ingress:
      - from:
          - namespace: ecpk-knative-eventing
          - namespace: ecpk-knative-serving
          - namespace: ecpk-knative-kafka
          - namespace: ecpk-knative-operator
          - namespace: kube-system
          # Проба kubelet в ambient: link-local и join-подсеть kube-ovn.
          - ipBlock:
              cidr: 169.254.7.127/32
          - ipBlock:
              cidr: 100.96.0.0/16
        ports:
          - port: 443
          - port: 8443
          - port: 15008
  - name: brcv
    selector:
      app: kafka-broker-receiver
